[package]
name = "serde-mihomo"
version = "0.1.0"
edition = "2024"
description = "Typed Rust model and Serde (de)serialization for the mihomo / Clash.Meta configuration file"
license = "MIT OR Apache-2.0"
keywords = ["mihomo", "clash", "yaml", "serde", "config"]
categories = ["config", "parser-implementations"]

[dependencies]
derive_aliases = "0.4"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1"
serde_json = "1"
